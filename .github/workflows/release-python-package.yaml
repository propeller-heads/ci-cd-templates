name: Release Python Package

on:
  workflow_call:
    inputs:
      package_root:
        description: "The root of the python project (containing pyproject.toml)"
        required: true
        type: string
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
        description: Runner tag for workflow
      repository:
        description: 'Repository name'
        required: false
        default: "protosim"
        type: string
      domain:
        description: 'AWS CodeArtifact domain'
        required: false
        default: "propeller"
        type: string
      yum_packages:
        description: "Packages to install using YUM (docker linux builds)"
        required: false
        type: string
        default: "pkgconfig"
      brew_packages:
        description: "Packages to install using Homebrew (MacOS builds)"
        required: false
        type: string
        default: ""
      use_maturin:
        description: 'Whether to use maturin for building the wheel'
        required: false
        type: boolean
        default: false
      push:
        description: "Whether to push the package once it is built"
        required: false
        default: true
        type: boolean
      py_version:
        description: | 
          Which python version to use for the build (see supported versions here 
          https://github.com/pypa/manylinux).
        required: false
        default: "3.9"
        type: string
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true
      role_to_assume:
        required: true
      aws_region:
        required: true
      domain_owner:
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_publish_package:
    runs-on: "${{ inputs.runs_on }}"
    steps:
      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@97c9e23528286821f97fba885c1b1123284b29cc  # v2.0.0
        with:
          app_id: ${{ secrets.app_id }}
          private_key: ${{ secrets.app_private_key }}

      - name: Install git on Linux
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt update && sudo apt install -y git

      - name: Install git on macOS
        if: ${{ runner.os == 'macOS' }}
        run: brew update && brew install git

      - name: Check out Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ secrets.role_to_assume }}
          audience: sts.amazonaws.com
          aws-region: ${{ secrets.aws_region }}

      - name: Install AWS CLI
        uses: unfor19/install-aws-cli-action@f5b46b7f32cf5e7ebd652656c5036bf83dd1e60c  # 1.0.8
        if: ${{ runner.os != 'macOS' }}
        with:
          version: 2
          verbose: false
          arch: amd64
          rootdir: ""
          workdir: ""

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ inputs.py_version }}

      - name: Install python package utils
        env:
          PY_VERSION: ${{ inputs.py_version }}
        run: |
          "python${PY_VERSION}" -m pip install --upgrade pip build twine

      - name: Write Dockerfile | Build wheel for Linux (with maturin)
        if: ${{ runner.os == 'Linux' && inputs.use_maturin }}
        env:
          PY_VERSION: ${{ inputs.py_version }}
          YUM_PACKAGES: ${{ inputs.yum_packages }}
        run: |
          cat <<EOF > Dockerfile.wheel
          FROM quay.io/pypa/manylinux2014_x86_64
          
          RUN yum install -y ${YUM_PACKAGES} && yum clean all
          
          RUN curl --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --default-toolchain=stable -y
          
          ENV PATH="/root/.cargo/bin:/opt/rh/devtoolset-10/root/usr/bin:$PATH"
          
          RUN python${PY_VERSION} -m pip install maturin
          
          WORKDIR /build
          CMD python${PY_VERSION} -m maturin build --release --compatibility manylinux2014 -i $(realpath "/usr/local/bin/python${PY_VERSION}")
          EOF
          
          cat Dockerfile.wheel

      - name: Build Docker Image | Build wheel for Linux (with maturin)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        if: ${{ runner.os == 'Linux' && inputs.use_maturin }}
        with:
          context: .
          tags: linux-wheel-builder
          file: Dockerfile.wheel
          push: false

      - name: Build | Build wheel for Linux (with maturin)
        uses: addnab/docker-run-action@4f65fabd2431ebc8d299f8e5a018d79a769ae185  # v3
        if: ${{ runner.os == 'Linux' && inputs.use_maturin }}
        env:
          APP_TOKEN: ${{ steps.generate-token.outputs.token }}
          PACKAGE_ROOT: ${{ inputs.package_root }}
          PY_VERSION: ${{ inputs.py_version }}
        with:
          image: linux-wheel-builder
          # -e NAME passes the step env value into the build container.
          options: -v ${{ github.workspace }}:/build -e APP_TOKEN -e PACKAGE_ROOT -e PY_VERSION
          run: |
            # allows resolving private git packages
            git config --global credential.helper store
            echo "https://${APP_TOKEN}@github.com" > ~/.git-credentials
            git config --global url."https://x-access-token:${APP_TOKEN}@github.com".insteadOf ssh://github.com
            
            cd "$PACKAGE_ROOT"
            "python${PY_VERSION}" -m maturin build --release --compatibility manylinux2014 -i $(realpath "/usr/local/bin/python${PY_VERSION}")
      

      - name: Set up Homebrew | Build wheel for macOS (with maturin)
        if: ${{ runner.os == 'macOS' && inputs.use_maturin }}
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Setup Rust | Build wheel for macOS (with maturin)
        if: ${{ runner.os == 'macOS' && inputs.use_maturin }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable

      - name: Setup Rust Cache | Build wheel for macOS (with maturin)
        if: ${{ runner.os == 'macOS' && inputs.use_maturin }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          cache-on-failure: true

      - name: Build | Build wheel for macOS (with maturin)
        if: ${{ runner.os == 'macOS' && inputs.use_maturin }}
        env:
          APP_TOKEN: ${{ steps.generate-token.outputs.token }}
          BREW_PACKAGES: ${{ inputs.brew_packages }}
          PACKAGE_ROOT: ${{ inputs.package_root }}
          PY_VERSION: ${{ inputs.py_version }}
        run: |
          if [ -n "$BREW_PACKAGES" ]; then
            # BREW_PACKAGES is a space-separated list. Keep it unquoted so each package is one word.
            # shellcheck disable=SC2086
            brew install $BREW_PACKAGES
          else
            echo "No packages to install."
          fi
          "python${PY_VERSION}" -m pip install maturin
          
          git config --global credential.helper store
          echo "https://${APP_TOKEN}@github.com" > ~/.git-credentials
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com".insteadOf ssh://github.com
          
          cd "$PACKAGE_ROOT"
          "python${PY_VERSION}" -m maturin build --release --interpreter $(which "python${PY_VERSION}")

      - name: Build wheel without maturin
        if: ${{ !inputs.use_maturin }}
        env:
          PACKAGE_ROOT: ${{ inputs.package_root }}
          PY_VERSION: ${{ inputs.py_version }}
        run: |
          cd "$PACKAGE_ROOT"
          "python${PY_VERSION}" -m build

      - name: Publish Python distribution to AWS CodeArtifact
        if: ${{ inputs.push }}
        shell: bash
        env:
          CODEARTIFACT_DOMAIN: ${{ inputs.domain }}
          CODEARTIFACT_DOMAIN_OWNER: ${{ secrets.domain_owner }}
          CODEARTIFACT_REPOSITORY: ${{ inputs.repository }}
          USE_MATURIN: ${{ inputs.use_maturin }}
          PACKAGE_ROOT: ${{ inputs.package_root }}
        run: |
          aws codeartifact login --tool twine --domain "$CODEARTIFACT_DOMAIN" --domain-owner "$CODEARTIFACT_DOMAIN_OWNER" --repository "$CODEARTIFACT_REPOSITORY"

          if [ "$USE_MATURIN" = "true" ]; then
            twine upload --repository codeartifact ./target/wheels/*.whl
          else
            cd "$PACKAGE_ROOT"
            twine upload --repository codeartifact ./dist/*.whl ./dist/*.tar.gz
          fi
