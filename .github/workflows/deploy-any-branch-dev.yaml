name: Deployment dev

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
        description: Runner tag for workflow
      timeout_minutes:
        required: false
        type: number
        default: 30
        description: Timeout for workflow
      image_tag:
        required: true
        type: string
        description: Image tag for docker artifact
      image_name:
        required: true
        type: string
        description: Image name for docker artifact
      app_name:
        required: false
        type: string
        description: |
          Release tag in helm-configuration helmwave/dev. Every dev release with this tag is
          deployed. Defaults to image_name. image_name is the entry in versions.yml whose tag
          is replaced.
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

jobs:
  deploy:
    runs-on: "${{ inputs.runs_on }}"
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: propeller-heads
          repositories: helm-configuration
          permission-contents: write
          permission-actions: read

      # helm-configuration checks the image and runs helmwave. This job has no cluster access.
      # See helm-configuration .github/workflows/deploy-dev-image.yaml.
      - name: Ask helm-configuration to deploy the image to dev
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          RELEASE_TAG: ${{ inputs.app_name || inputs.image_name }}
          REQUESTED_BY: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          request_id="$(cat /proc/sys/kernel/random/uuid)"
          jq --null-input \
            --arg app "${IMAGE_NAME}" \
            --arg tag "${IMAGE_TAG}" \
            --arg release_tag "${RELEASE_TAG}" \
            --arg request_id "${request_id}" \
            --arg requested_by "${REQUESTED_BY}" \
            '{event_type: "deploy-dev-image", client_payload: {app: $app, tag: $tag, release_tag: $release_tag, request_id: $request_id, requested_by: $requested_by}}' |
            gh api --method POST repos/propeller-heads/helm-configuration/dispatches --input -
          echo "request_id=${request_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the deployment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REQUEST_ID: ${{ steps.dispatch.outputs.request_id }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          runs_path="repos/propeller-heads/helm-configuration/actions/workflows/deploy-dev-image.yaml/runs"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh api "${runs_path}?event=repository_dispatch&per_page=50" \
              --jq "[.workflow_runs[] | select(.display_title | endswith(\"[${REQUEST_ID}]\"))][0].id // empty")
            [[ -n "${run_id}" ]] && break
            sleep 5
          done
          if [[ -z "${run_id}" ]]; then
            echo "::error::helm-configuration did not start a Deploy image to dev run for request ${REQUEST_ID}."
            exit 1
          fi

          run_url="https://github.com/propeller-heads/helm-configuration/actions/runs/${run_id}"
          echo "Deploy image to dev run: ${run_url}"
          while true; do
            read -r status conclusion < <(gh api "repos/propeller-heads/helm-configuration/actions/runs/${run_id}" \
              --jq '"\(.status) \(.conclusion // "none")"')
            [[ "${status}" == "completed" ]] && break
            sleep 15
          done

          {
            echo "### Deployed image to dev environment"
            echo "\`${IMAGE_NAME}:${IMAGE_TAG}\`: [${conclusion}](${run_url})"
          } >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::The dev deployment finished with '${conclusion}'. See ${run_url}"
            exit 1
          fi
