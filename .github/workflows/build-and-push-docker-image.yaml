name: Build and push docker image

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
        description: Runner tag for workflow
      timeout_minutes:
        required: false
        type: number
        default: 60
        description: Timeout for workflow
      image_tag:
        required: true
        type: string
        description: Image tag for docker artifact
      image_name:
        required: true
        type: string
        description: Image name
      cache:
        required: false
        type: boolean
        default: true
        description: Enable or disable cache for kaniko
      cache_repository:
        required: false
        type: string
        default: build-cache
        description: >-
          ECR repository for the kaniko layer cache. Kaniko rewrites an expired cache entry under
          the same tag, so this must be a repository with mutable tags; the image repositories are
          immutable and refuse the rewrite, which leaves every build after the first expiry cold.
          Cache keys are content hashes, so every image can share one repository.
      build_args:
        required: false
        type: string
        description: Build args. Newline-delimited list of key=value pairs.
      tycho_client_version_default:
        type: string
        required: false
      tycho_client_version:
        type: string
        required: false
      dockerfile:
        required: false
        type: string
        default: Dockerfile
        description: Path to the Dockerfile, relative to the repository root
      build_tool:
        required: false
        type: string
        default: kaniko
      kaniko_verbosity:
        required: false
        type: string
        default: info
        description: Verbosity level for kaniko (e.g. debug, info, warn, error, fatal, panic)
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true
      role_to_assume:
        required: true
      aws_region:
        required: true
      repository_url:
        required: true
      domain_owner:
        required: true
    outputs:
      image_digest:
        description: "Docker image digest for uniquely identifying the image"
        value: ${{ jobs.build-and-push.outputs.digest }}

jobs:
  build-and-push:
    runs-on: "${{ inputs.runs_on }}"
    timeout-minutes: "${{ inputs.timeout_minutes }}"
    outputs:
      digest: ${{ steps.check-image.outputs.skip_remaining_steps == 'true' && steps.check-image.outputs.existing_digest || (inputs.build_tool == 'kaniko' && steps.build-kaniko.outputs.digest || steps.build-docker.outputs.digest) }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@97c9e23528286821f97fba885c1b1123284b29cc  # v2.0.0
        with:
          app_id: ${{ secrets.app_id }}
          private_key: ${{ secrets.app_private_key }}

      - name: Install git
        run: sudo apt update && sudo apt install -y git

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: false

      - name: Assume role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: "${{ secrets.role_to_assume }}"
          audience: sts.amazonaws.com
          aws-region: "${{ secrets.aws_region }}"

      - name: Login in ECR
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783  # v2.2.0
        id: ecr

      - name: Check if image already exists
        id: check-image
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          DOMAIN_OWNER: ${{ secrets.domain_owner }}
        run: |
          IMAGE="$IMAGE_NAME:$IMAGE_TAG"

          # Try to fetch the image from the registry and capture its digest
          if DIGEST=$(aws ecr describe-images --registry-id "$DOMAIN_OWNER" --repository-name "$IMAGE_NAME" --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null) && [ -n "$DIGEST" ] && [ "$DIGEST" != "None" ]; then
            echo "Image $IMAGE already exists in the repository with digest $DIGEST"
            echo "skip_remaining_steps=true" >> $GITHUB_OUTPUT
            echo "existing_digest=$DIGEST" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Image $IMAGE not found, proceeding with build"
            echo "skip_remaining_steps=false" >> $GITHUB_OUTPUT
          fi

      - name: Download Tycho-client from S3
        if: "${{ inputs.image_name == 'defibot' && steps.check-image.outputs.skip_remaining_steps != 'true' }}"
        env:
          TYCHO_CLIENT_VERSION: ${{ inputs.tycho_client_version }}
          TYCHO_CLIENT_VERSION_DEFAULT: ${{ inputs.tycho_client_version_default }}
        run: |
          # Ensure the manifest file is empty or create it if it doesn't exist
          MANIFEST_FILE="manifest.txt"
          echo -n "" > "$MANIFEST_FILE"
          # Determine the tycho_client_version to use
          if [ -z "$TYCHO_CLIENT_VERSION" ]; then
            echo "Using default tycho_client_version: $TYCHO_CLIENT_VERSION_DEFAULT"
            FILE="$TYCHO_CLIENT_VERSION_DEFAULT"
          else
            echo "Using provided tycho_client_version: $TYCHO_CLIENT_VERSION"
            FILE="$TYCHO_CLIENT_VERSION"
          fi
          echo "Tycho-client binary: $FILE"
          aws s3 cp "s3://repo.propellerheads-propellerheads/tycho-client/$FILE" ./
          tar -xzf "$FILE"
          EXTRACTED_NAME=$(tar -tzf "$FILE" | grep tycho-client | head -n 1)
          mv $EXTRACTED_NAME ./defibot/tycho/bins/tycho-client
          echo "$FILE" > "$MANIFEST_FILE"
          rm "$FILE"

      - name: Login in pip codeartifact
        if: "${{ (inputs.image_name == 'defibot' || inputs.image_name == 'pyth') && steps.check-image.outputs.skip_remaining_steps != 'true' }}"
        env:
          DOMAIN_OWNER: ${{ secrets.domain_owner }}
        run: |
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain propeller --domain-owner "$DOMAIN_OWNER" --query authorizationToken --output text --duration 1800)
          echo PIP_INDEX_URL="https://aws:${CODEARTIFACT_AUTH_TOKEN}@propeller-${DOMAIN_OWNER}.d.codeartifact.eu-central-1.amazonaws.com/pypi/protosim/simple/" >> $GITHUB_ENV

      - name: Setup git to use https
        if: "${{ inputs.image_name == 'propeller-searcher' && steps.check-image.outputs.skip_remaining_steps != 'true' }}"
        env:
          APP_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          git config --global credential.helper store
          echo "https://${APP_TOKEN}@github.com" > ~/.git-credentials
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com".insteadOf ssh://github.com

      - name: Setup toolchain
        if: "${{ inputs.image_name == 'propeller-searcher' && steps.check-image.outputs.skip_remaining_steps != 'true' }}"
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # v1
        with:
          toolchain: stable

      - name: Pull private dependencies
        if: "${{ inputs.image_name == 'propeller-searcher' && steps.check-image.outputs.skip_remaining_steps != 'true' }}"
        run: |
          export CARGO_HOME=$(pwd)/.cargo
          cargo fetch

      - name: Get Speedex binary
        if: "${{ inputs.image_name == 'turbine' && steps.check-image.outputs.skip_remaining_steps != 'true' }}"
        run: |
          mkdir -p src/clearing_algorithm/speedex/bin
          aws s3 cp s3://propellerheads-speedex/propeller_speedex_amd src/clearing_algorithm/speedex/bin/propeller_speedex
          chmod +x src/clearing_algorithm/speedex/bin/propeller_speedex

      - name: Build and push docker image with kaniko
        id: build-kaniko
        if: ${{ inputs.build_tool == 'kaniko' && steps.check-image.outputs.skip_remaining_steps != 'true' }}
        uses: int128/kaniko-action@e0d025ac32874fbd71d63fbfadf84aa87a8088f5  # v1.72.0
        with:
          push: true
          tags: ${{ secrets.repository_url }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
          file: ${{ inputs.dockerfile }}
          cache: "${{ inputs.cache }}"
          cache-repository: "${{ secrets.repository_url }}/${{ inputs.cache_repository }}"
          build-args: |
            PIP_INDEX_URL=${{ env.PIP_INDEX_URL }}
            ${{ inputs.build_args }}
          verbosity: ${{ inputs.kaniko_verbosity }}
        env:
          SOURCE_DATE_EPOCH: 0

      - name: Set up Docker Buildx
        if: ${{ inputs.build_tool == 'docker' && steps.check-image.outputs.skip_remaining_steps != 'true' }}
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Build and push docker image with docker
        id: build-docker
        if: ${{ inputs.build_tool == 'docker' && steps.check-image.outputs.skip_remaining_steps != 'true' }}
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4  # v6.15.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ secrets.repository_url }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
          build-args: |
            PIP_INDEX_URL=${{ env.PIP_INDEX_URL }}
            ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
        env:
          SOURCE_DATE_EPOCH: 0

      - name: Add image info to workflow summary
        env:
          SKIP_REMAINING_STEPS: ${{ steps.check-image.outputs.skip_remaining_steps }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          IMAGE_DIGEST: ${{ steps.check-image.outputs.skip_remaining_steps == 'true' && steps.check-image.outputs.existing_digest || (inputs.build_tool == 'kaniko' && steps.build-kaniko.outputs.digest || steps.build-docker.outputs.digest) }}
        run: |
          if [[ "$SKIP_REMAINING_STEPS" == "true" ]]; then
            echo "## Didn't push Docker image because it is already present in the repo" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Built and pushed Docker image" >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`$IMAGE_NAME:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "\`$IMAGE_DIGEST\`" >> $GITHUB_STEP_SUMMARY
