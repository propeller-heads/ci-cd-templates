name: Deploy to STG|PROD env

# Kept for the callers that still use it. It does the same as promote-to-dev.yaml, which accepts
# only "dev" and "staging". Promote to prod with promote-to-production.yaml, which opens a pull
# request for review.
on:
  workflow_call:
    inputs:
      image_name:
        description: "Application name"
        required: true
        type: string
      image_tag:
        description: "Application tag"
        required: true
        type: string
      environment:
        description: "Environment deploy to: dev or staging"
        required: true
        type: string
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

jobs:
  promote-to-deploy:
    name: Deploy to STG|PROD env
    # The job uses the app token only.
    permissions: {}
    # Callers use this file at main, so it calls promote-to-dev at main too.
    uses: propeller-heads/ci-cd-templates/.github/workflows/promote-to-dev.yaml@main  # zizmor: ignore[unpinned-uses]
    with:
      image_name: ${{ inputs.image_name }}
      image_tag: ${{ inputs.image_tag }}
      environment: ${{ inputs.environment }}
    secrets:
      app_id: ${{ secrets.app_id }}
      app_private_key: ${{ secrets.app_private_key }}
