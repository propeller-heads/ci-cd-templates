name: Promote to environment

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
      timeout_minutes:
        required: false
        type: number
        default: 30
      image_tag:
        required: true
        type: string
        description: Image tag for production
      image_name:
        required: true
        type: string
        description: Application name
      environment:
        required: false
        type: string
        default: dev
        description: |
          Target environment in helm-configuration. The workflow updates
          helmwave/<environment>/versions.yml. Must be "dev" or "staging"
          — prod promotion is not allowed via this workflow; use
          promote-to-production.yaml for prod.
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

jobs:
  promote-to-dev:
    name: Promote to ${{ inputs.environment }}
    runs-on: "${{ inputs.runs_on }}"
    steps:
      - name: Validate environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "${ENVIRONMENT}" in
            dev|staging) ;;
            *) echo "::error::environment must be 'dev' or 'staging', got '${ENVIRONMENT}'" && exit 1 ;;
          esac

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: propeller-heads
          repositories: helm-configuration
          permission-contents: write

      - name: Install yq
        env:
          YQ_VERSION: v4.54.1
          YQ_SHA256: 8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f
        run: |
          set -euo pipefail
          curl -fsSL -o yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  yq" | sha256sum -c -
          sudo install -m 0755 yq /usr/bin/yq
          rm yq

      - name: Checkout helm-configuration repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          # actions-js/push pushes with its own token in the remote URL.
          persist-credentials: false
          repository: propeller-heads/helm-configuration
          ref: main
          token: ${{ steps.generate-token.outputs.token }}

      - name: Replace release version
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          yq eval '.[strenv(IMAGE_NAME)].tag = strenv(IMAGE_TAG)' -i "helmwave/${ENVIRONMENT}/versions.yml"

      - name: Commit & Push changes
        uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc  # v1.6
        with:
          github_token: ${{ steps.generate-token.outputs.token }}
          message: "${{ inputs.environment }}: Update version of ${{ inputs.image_name }} with tag ${{ inputs.image_tag }}"
          repository: propeller-heads/helm-configuration
