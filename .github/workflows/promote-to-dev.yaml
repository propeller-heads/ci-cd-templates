name: Promote to environment

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
      timeout_minutes:
        required: false
        type: number
        default: 30
      image_tag:
        required: true
        type: string
        description: Image tag for production
      image_name:
        required: true
        type: string
        description: Application name
      environment:
        required: false
        type: string
        default: dev
        description: |
          Target environment in helm-configuration: "dev" or "staging". The
          workflow asks helm-configuration to set the tag of image_name in
          helmwave/<environment>/versions.yml, and waits for the result. Use
          promote-to-production.yaml for prod.
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true

jobs:
  promote-to-dev:
    name: Promote to ${{ inputs.environment }}
    runs-on: "${{ inputs.runs_on }}"
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Validate environment
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "${ENVIRONMENT}" in
            dev|staging) ;;
            *) echo "::error::environment must be 'dev' or 'staging', got '${ENVIRONMENT}'. Use promote-to-production.yaml for prod." && exit 1 ;;
          esac

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: propeller-heads
          repositories: helm-configuration
          permission-contents: write
          permission-actions: read

      # helm-configuration decides if the bump is permitted, and pushes it. This job cannot push
      # to main. See helm-configuration .github/workflows/version-bump.yaml.
      - name: Ask helm-configuration for the version bump
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REQUESTED_BY: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          request_id="$(cat /proc/sys/kernel/random/uuid)"
          jq --null-input \
            --arg environment "${ENVIRONMENT}" \
            --arg app "${IMAGE_NAME}" \
            --arg tag "${IMAGE_TAG}" \
            --arg request_id "${request_id}" \
            --arg requested_by "${REQUESTED_BY}" \
            '{event_type: "bump-version", client_payload: {environment: $environment, app: $app, tag: $tag, request_id: $request_id, requested_by: $requested_by}}' |
            gh api --method POST repos/propeller-heads/helm-configuration/dispatches --input -
          echo "request_id=${request_id}" >> "${GITHUB_OUTPUT}"

      - name: Wait for the version bump
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          REQUEST_ID: ${{ steps.dispatch.outputs.request_id }}
        run: |
          set -euo pipefail
          runs_path="repos/propeller-heads/helm-configuration/actions/workflows/version-bump.yaml/runs"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh api "${runs_path}?event=repository_dispatch&per_page=50" \
              --jq "[.workflow_runs[] | select(.display_title | endswith(\"[${REQUEST_ID}]\"))][0].id // empty")
            [[ -n "${run_id}" ]] && break
            sleep 5
          done
          if [[ -z "${run_id}" ]]; then
            echo "::error::helm-configuration did not start a Version bump run for request ${REQUEST_ID}."
            exit 1
          fi

          run_url="https://github.com/propeller-heads/helm-configuration/actions/runs/${run_id}"
          echo "Version bump run: ${run_url}"
          while true; do
            read -r status conclusion < <(gh api "repos/propeller-heads/helm-configuration/actions/runs/${run_id}" \
              --jq '"\(.status) \(.conclusion // "none")"')
            [[ "${status}" == "completed" ]] && break
            sleep 10
          done

          echo "Version bump: [${conclusion}](${run_url})" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::The version bump finished with '${conclusion}'. See ${run_url}"
            exit 1
          fi
