name: Release

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
      timeout_minutes:
        required: false
        type: number
        default: 30
      args:
        required: false
        type: string
      python_version:
        required: false
        type: string
        default: "3.12"
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true
    outputs:
      next_release_version:
        value: ${{ jobs.release.outputs.NEXT_RELEASE_VERSION }}
      verify_release_version:
        value: ${{ jobs.release.outputs.VERIFY_RELEASE_VERSION }}

jobs:
  release:
    name: release
    runs-on: "${{ inputs.runs_on }}"
    outputs:
      NEXT_RELEASE_VERSION: ${{ steps.semantic.outputs.NEXT_RELEASE_VERSION }}
      VERIFY_RELEASE_VERSION: ${{ steps.semantic.outputs.VERIFY_RELEASE_VERSION }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@97c9e23528286821f97fba885c1b1123284b29cc  # v2.0.0
        with:
          app_id: ${{ secrets.app_id }}
          private_key: ${{ secrets.app_private_key }}

      - name: Install git
        run: sudo apt update && sudo apt install -y git

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          submodules: recursive
          token: ${{ steps.generate-token.outputs.token }}

      - name: Setup git to use https
        env:
          APP_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
            git config --global credential.helper store
            echo "https://${APP_TOKEN}@github.com" > ~/.git-credentials
            git config --global url."https://x-access-token:${APP_TOKEN}@github.com".insteadOf ssh://github.com

      - name: Set up Python environment
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install toml-cli
        run: pip install toml-cli

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20.11.1

      - name: Setup npm with corepack
        run: |
          corepack enable
          corepack prepare npm@10.9.2 --activate

      - name: Install dependencies
        run: npm install --save-dev semver@7.6.3 semantic-release@23.0.2 @semantic-release/changelog@6.0.3 @semantic-release/git@10.0.1 conventional-changelog-conventionalcommits@7.0.2 conventional-changelog-eslint@5.0.0 @semantic-release/exec@6.0.3 --legacy-peer-deps

      - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
        run: corepack npm audit signatures

      - name: Semantic release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          SEMANTIC_RELEASE_ARGS: ${{ inputs.args }}
        run: |
          # SEMANTIC_RELEASE_ARGS holds several CLI flags, and callers quote some of them
          # (for example --tag-format 'v${version}'). xargs splits the words and removes the
          # quotes like the shell did, but it does not expand variables or run commands.
          printf '%s' "$SEMANTIC_RELEASE_ARGS" | xargs npx semantic-release
