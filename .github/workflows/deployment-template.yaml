name: Deployment

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
        description: Runner tag for workflow
      timeout_minutes:
        required: false
        type: number
        default: 30
        description: Timeout for workflow
      slack_webhook_url:
        required: true
        type: string
        description: Slack webhook url
      workflow_url:
        required: true
        type: string
        description: Workflow url
      environment:
        required: true
        type: string
        description: Environment name
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true
      role_to_assume:
        required: true
      aws_region:
        required: true
      eks_cluster_name:
        required: true

env:
  SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
  WORKFLOW_URL: ${{ inputs.workflow_url }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  deploy:
    runs-on: "${{ inputs.runs_on }}"
    steps:
      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@97c9e23528286821f97fba885c1b1123284b29cc  # v2.0.0
        with:
          app_id: ${{ secrets.app_id }}
          private_key: ${{ secrets.app_private_key }}

      - name: Checkout helm-configuration repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install-aws-cli
        uses: unfor19/install-aws-cli-action@f5b46b7f32cf5e7ebd652656c5036bf83dd1e60c  # 1.0.8
        with:
          version: 2
          verbose: false
          arch: amd64
          rootdir: ""
          workdir: ""

      - name: Assume role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: "${{ secrets.role_to_assume }}"
          audience: sts.amazonaws.com
          aws-region: "${{ secrets.aws_region }}"

      - name: Setup kubeconfig
        env:
          EKS_CLUSTER_NAME: ${{ secrets.eks_cluster_name }}
          EKS_CLUSTER_REGION: ${{ secrets.aws_region }}
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$EKS_CLUSTER_REGION"

      - name: Install helmwave
        uses: helmwave/setup-action@a2b84aea3434be147501a53655b9fec902532533  # v0.3.0
        with:
          version: 0.37.1

      - name: Slack Notification
        run: bash scripts/slack-notify.sh started
        env:
          WORKFLOW_STATUS: ":large_blue_square: In Progress"

      - name: Deploy app uses helmwave
        run: |
          cd "helmwave/$ENVIRONMENT"
          helmwave yml
          helmwave up --build
        env:
          HELMWAVE_KUBEDOG_ENABLED: true

      - name: Slack Notification
        if: success()
        run: bash scripts/slack-notify.sh succeed
        env:
          WORKFLOW_STATUS: ":large_green_square: Completed"

      - name: Slack Notification
        if: failure()
        run: bash scripts/slack-notify.sh failed
        env:
          WORKFLOW_STATUS: ":large_red_square: Failed"
