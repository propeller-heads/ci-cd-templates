name: Deployment

on:
  workflow_call:
    inputs:
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
        description: Runner tag for workflow
      timeout_minutes:
        required: false
        type: number
        default: 30
        description: Timeout for workflow
      slack_webhook_url:
        required: true
        type: string
        description: Slack webhook url
      workflow_url:
        required: true
        type: string
        description: Workflow url
      environment:
        required: true
        type: string
        description: Environment name
      skip_unchanged:
        required: false
        type: boolean
        default: false
        description: >-
          Deploy only releases whose manifests changed (helmwave --skip-unchanged). If a release
          in the plan is not in the `deployed` state, the run deploys everything instead.
    secrets:
      app_id:
        required: true
      app_private_key:
        required: true
      role_to_assume:
        required: true
      aws_region:
        required: true
      eks_cluster_name:
        required: true

env:
  SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
  WORKFLOW_URL: ${{ inputs.workflow_url }}
  ENVIRONMENT: ${{ inputs.environment }}

jobs:
  deploy:
    runs-on: "${{ inputs.runs_on }}"
    steps:
      - name: Generate a token
        id: generate-token
        uses: getsentry/action-github-app-token@v2
        with:
          app_id: ${{ secrets.app_id }}
          private_key: ${{ secrets.app_private_key }}

      - name: Checkout helm-configuration repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2
          verbose: false
          arch: amd64
          rootdir: ""
          workdir: ""

      - name: Assume role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "${{ secrets.role_to_assume }}"
          audience: sts.amazonaws.com
          aws-region: "${{ secrets.aws_region }}"

      - name: Setup kubeconfig
        run: aws eks update-kubeconfig --name "${{ secrets.eks_cluster_name }}" --region "${{ secrets.aws_region }}"

      - name: Install helmwave
        uses: helmwave/setup-action@v0.3.0
        with:
          version: 0.37.1

      - name: Slack Notification
        run: bash scripts/slack-notify.sh started
        env:
          WORKFLOW_STATUS: ":large_blue_square: In Progress"

      # With skip_unchanged, helmwave compares each release with the manifest stored in its latest
      # Helm revision, whatever the state of that revision. It does not look at the objects in the
      # cluster. So it would skip a release that failed, is pending, or is stuck uninstalling, if
      # its manifest did not change. A full deploy retried such releases, so this keeps that: when
      # one release of the plan is not `deployed`, the run deploys everything.
      - name: Deploy app uses helmwave
        env:
          HELMWAVE_KUBEDOG_ENABLED: true
          SKIP_UNCHANGED: ${{ inputs.skip_unchanged }}
        run: |
          set -euo pipefail
          cd "helmwave/${ENVIRONMENT}"
          helmwave yml

          if [ "${SKIP_UNCHANGED}" != "true" ]; then
            helmwave up --build
            exit 0
          fi

          # Latest Helm revision of every release in the plan; print those not `deployed`. If the
          # check itself fails, deploy everything, as before this option existed.
          if ! not_deployed="$(
            yq '.releases[] | select(.namespace != null) | .namespace' helmwave.yml | sort -u \
              | while read -r ns; do
                  kubectl get secrets --namespace "${ns}" --selector owner=helm --output json \
                    | jq -r --arg ns "${ns}" '[.items[].metadata.labels]
                        | group_by(.name)[] | max_by(.version | tonumber)
                        | select(.status != "deployed") | "\(.name)@\($ns) \(.status)"'
                done \
              | awk 'NR == FNR { plan[$1] = 1; next } ($1 in plan)' \
                  <(yq '.releases[] | .name + "@" + .namespace' helmwave.yml) -
          )"; then
            echo "::warning::Could not read the Helm release states, deploying everything"
            helmwave up --build
          elif [ -n "${not_deployed}" ]; then
            echo "::warning::Releases not in the deployed state, deploying everything: $(echo "${not_deployed}" | tr '\n' ',')"
            helmwave up --build
          else
            helmwave up --build --skip-unchanged --diff-mode live
          fi

      - name: Slack Notification
        if: success()
        run: bash scripts/slack-notify.sh succeed
        env:
          WORKFLOW_STATUS: ":large_green_square: Completed"

      - name: Slack Notification
        if: failure()
        run: bash scripts/slack-notify.sh failed
        env:
          WORKFLOW_STATUS: ":large_red_square: Failed"
