on:
  pull_request:
    branches:
      - main

jobs:
  lints:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        persist-credentials: false

    - name: actionlint
      uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0
      with:
        shellcheck: false
